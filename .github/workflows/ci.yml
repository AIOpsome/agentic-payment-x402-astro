name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install

      - name: Build Bundles
        run: pnpm build

      - name: Run Unit Tests
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      # In-workspace builds resolve through pnpm symlinks, so they cannot catch an `exports`
      # subpath that is missing from the published tarball. This packs and installs for real.
      - name: Verify Packed Artifacts In A Real Astro App
        run: pnpm verify:packed
